<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* Same look as the 导论 / Meiji pages (white canvas, gray rounded cards, frosted bars, hairlines), with yellow as the accent. */
:root{
  --bg:#ffffff; --card:#f2f2f4; --ink:#000000; --ink2:#3c3c43d9; --mute:#3c3c4399; --sep:#d1d1d6;
  --accent:#000000; --on-accent:#ffffff; --tint:#FFF4C7; --tint-ink:#7a5d00; --bar:#FFCC00; --track:#00000010;
  --fill:#7676801f; --glow:transparent; --danger:#FF3B30;
  --glass:rgba(255,255,255,.55); --glass-w:rgba(255,255,255,.82); --scrim:rgba(0,0,0,.28);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","PingFang SC","Noto Sans CJK JP",system-ui,sans-serif;
  --hdr:48px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf5d9; --mute:#ebebf599; --sep:#38383a;
  --accent:#ffffff; --on-accent:#000000; --tint:#2b2500; --tint-ink:#ffd60a; --bar:#FFD60A; --track:#ffffff14;
  --fill:#7676803d; --glow:transparent; --danger:#FF453A;
  --glass:rgba(22,22,24,.55); --glass-w:rgba(28,28,30,.84); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
*{box-sizing:border-box;cursor:default}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input{font:inherit;color:inherit;cursor:text}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);border-bottom:.5px solid var(--sep)}
.top-in{max-width:560px;margin-inline:auto;height:var(--hdr);display:grid;grid-template-columns:88px 1fr 88px;align-items:center;padding-inline:6px}
.ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;transition:background-color .15s ease}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.3}
@media (hover:hover){.ib:hover:not(:disabled),.chip:hover{background-color:var(--fill)}}
.mnav{display:flex;align-items:center;justify-content:center;gap:2px}
.mnav .label{min-width:112px;text-align:center;font-weight:600;font-size:16px;letter-spacing:-.01em}
.hb{justify-self:end;display:flex}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);display:none}
.dot.on{display:block}

main{max-width:560px;margin-inline:auto;padding:12px 12px 110px}

/* summary */
.fbar{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:12px;color:var(--mute)}
.fbar button{padding:3px 10px;border-radius:11px;background:var(--card);color:var(--ink2)}
.cal{margin-top:4px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-h span{text-align:center;font-size:11px;color:var(--mute);padding-bottom:4px}
.cal-d{min-height:46px;min-width:0;border-radius:9px;padding:4px 1px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card);transition:background-color .15s ease}
.cal-d.has{background:var(--tint)}
.cal-d.blank{pointer-events:none;background:transparent}
.cal-d .n{font-size:12px;line-height:18px;min-width:18px;height:18px;border-radius:9px;text-align:center;color:var(--ink2)}
.cal-d.today .n{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal-d .v{font-weight:600;font-size:10.5px;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.cal-d.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
@media (hover:hover){.cal-d:hover:not(.blank){background-color:var(--fill)}}
.cats2{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;margin:0 2px}
.catr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 8px;border-radius:8px;text-align:left;transition:background-color .15s ease}
.catr .nm{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catr .am{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.catr.sel{background:transparent;box-shadow:inset 0 0 0 1px var(--k,var(--accent))}
.catr.sel .nm{color:var(--ink);font-weight:600}
.calbar{display:flex;justify-content:center;margin-top:2px}
.calbar button{width:46px;height:26px;border-radius:13px;display:grid;place-items:center;color:var(--mute);transition:background-color .15s ease}
.calbar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.calbar.open svg{transform:rotate(180deg)}
/* restrained styling */
.k-Eating{--k:#FADF14}.k-Drinking{--k:#EBCFA9}.k-Transport{--k:#2E90FF}.k-Goods{--k:#D9628A}.k-Medical{--k:#9AD3A2}.k-Groceries{--k:#F0893A}.k-Other{--k:#9A9AA0}
.kd{flex:none;display:block;width:8px;height:8px;border-radius:50%;background:var(--k,#9A9AA0)}
.lines{display:block;background:var(--card);border-radius:8px;padding:2px 12px;overflow:hidden}
.lrow:last-child{border-bottom:0}
.day{margin:18px 4px 6px}
.catr{align-items:center;justify-content:flex-start;gap:9px}
.catr .nm{flex:1;min-width:0}
.cal-g{gap:4px}
.cal-d{position:relative;min-height:50px;padding:0;border-radius:7px;display:block}
.cal-d .n{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0}
.cal-d .v{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.cal-d.has{background:var(--card)}
.calwrap{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .2s cubic-bezier(.4,0,.2,1),visibility 0s .2s}
.calwrap.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .2s cubic-bezier(.4,0,.2,1),visibility 0s}
.calin{overflow:hidden;min-height:0}
@media (prefers-reduced-motion:reduce){.calwrap,.calwrap.open{transition:none}}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 6px;border-bottom:.5px solid var(--sep);transition:background-color .15s ease}
.kd.sup{display:inline-block;width:6px;height:6px;margin-left:3px;position:relative;top:-.55em}
.lrow .t{font-size:15px;overflow-wrap:anywhere}
.lrow .s{font-size:12px;color:var(--mute)}
.lrow .a{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
    .lrow:last-child{border-bottom:0}
@media (hover:hover){.catr:hover,.lrow:hover,.calbar button:hover{background-color:var(--fill)}}



/* list */
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 6px 6px;font-size:13px;color:var(--mute);font-weight:500}
.day b{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:56px 20px;font-size:14px}

/* add button */
.fab{position:fixed;right:max(18px,calc(50vw - 280px + 18px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);transition:filter .15s ease,transform .15s ease}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
@media (hover:hover){.fab:hover{filter:brightness(.96)}}
.fab:active{transform:scale(.96)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin-inline:auto;max-height:92vh;overflow:auto;background:var(--glass-w);-webkit-backdrop-filter:blur(40px) saturate(1.9);backdrop-filter:blur(40px) saturate(1.9);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -1px 0 var(--sep)}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-h h2{margin:0;font-size:16px;font-weight:600}
.amt{display:flex;align-items:baseline;gap:6px;background:var(--tint);border-radius:14px;padding:12px 16px}
.amt span{font-size:26px;font-weight:700;color:var(--tint-ink)}
.amt input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:700;letter-spacing:-.02em;outline:none;font-variant-numeric:tabular-nums}
.fld{display:block;margin-top:10px}
.fld>span{display:block;font-size:12px;color:var(--mute);margin:0 4px 4px}
.fld input{width:100%;border:0;background:var(--card);border-radius:12px;padding:11px 14px;outline:none;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:6px 13px;border-radius:15px;background:var(--card);color:var(--ink2);font-size:14px;transition:background-color .15s ease}
.chip.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:46px;border-radius:13px;background:var(--card);font-weight:600;font-size:16px;transition:filter .15s ease}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.del{flex:0 0 auto;padding-inline:18px;color:var(--danger)}
@media (hover:hover){.btn:hover{filter:brightness(.96)}}
.hint{font-size:12px;color:var(--mute);margin:10px 4px 0}
.note-s{font-size:12px;color:var(--mute);margin:8px 4px 0;min-height:1.4em}

/* v4 */
.day{margin:18px 0 6px;padding:0 18px}
.lrow .t{position:relative;display:block}
.kd.sup{position:absolute;left:-8px;top:.15em;margin:0;display:block;width:6px;height:6px}
.shop{font-family:ui-monospace,SFMono-Regular,Menlo,"Hiragino Sans","PingFang SC",monospace;font-size:11px;line-height:1.3;padding:1px 6px;margin-left:4px;border-radius:5px;background:var(--fill);color:var(--ink2);white-space:normal;vertical-align:1px}
.cal{padding-inline:18px;margin-top:2px}
.cal-h span{font-size:10.5px;padding-bottom:2px}
.cal-g{gap:0}
.cal-d,.cal-d.has{min-height:40px;padding:2px 0 0;border-radius:8px;background:none;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:0}
.cal-d.blank{pointer-events:none}
.cal-d .n{position:static;transform:none;font-size:13.5px;line-height:22px;min-width:22px;height:22px;border-radius:11px;margin:0;color:var(--ink)}
.cal-d .v{position:static;font-size:9.5px;line-height:1.2;font-weight:500;color:var(--mute)}
.cal-d.today .n{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal-d.sel .n{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-d.sel.today .n{box-shadow:none}
.cal-d.sel{box-shadow:none}

/* v5 inline editor */
.efwrap{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .2s cubic-bezier(.4,0,.2,1),visibility 0s .2s}
.efwrap.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .2s cubic-bezier(.4,0,.2,1),visibility 0s}
.efin{overflow:hidden;min-height:0}
.efwrap.solo{background:var(--card);border-radius:8px;margin-top:12px}
.ef{padding:12px 18px 14px}
.lines .ef{padding:6px 6px 14px}
.amtl{display:flex;align-items:baseline;gap:4px;border-bottom:1px solid var(--sep);padding:4px 0 4px;margin:0}
.amtl input{border:0;background:none;outline:none;font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0;min-width:0;width:1.3ch;border-radius:0}
.amtl span{font-size:18px;font-weight:600;color:var(--mute)}
.ln{display:block;width:100%;border:0;border-bottom:1px solid var(--sep);background:none;border-radius:0;padding:11px 0;outline:none;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none;text-align:left}
.ln::-webkit-date-and-time-value{text-align:left}
.ef .chips{margin-top:14px}
.ef .chip{background:var(--fill)}
.ef .chip.on{background:var(--k,var(--accent));color:#1c1c1e;font-weight:600}
.ef .btn{background:var(--fill)}
.ef .btn.pri{background:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:reduce){.efwrap,.efwrap.open{transition:none}}

/* v6 compact auto-saving editor */
.ef{font-size:13.5px;padding:10px 18px 12px}
.lines .ef{padding:4px 6px 12px}
.eftop{display:flex;align-items:flex-end;gap:12px}
.eftop .amtl{flex:1;min-width:0}
.amtl input{font-size:15px;font-weight:700;letter-spacing:0}
.amtl span{font-size:13px}
.ln{font-size:13.5px;padding:8px 0;min-height:34px}
.eftop .ln.dt{flex:none;width:112px}
.ef .btn.del{flex:none;height:auto;min-height:0;width:auto;padding:8px 2px 8px 6px;background:none;font-size:13px;font-weight:500;color:var(--danger)}
.ef .chips{gap:5px;margin-top:10px}
.ef .chip{padding:3px 10px;font-size:12px;border-radius:12px}

/* v7 editor layout */
:root{--card-lt:#f8f8fa}
@media (prefers-color-scheme:dark){:root{--card-lt:#262628}}
.ef input:focus,.ef input:focus-visible,.ef button:focus-visible{outline:none}
.ef{color:var(--ink2);font-size:13.5px;padding:8px 18px 12px}
.lines .efwrap{margin-inline:-12px;background:var(--card-lt)}
.lines .ef{padding:6px 18px 8px}
.lines .efwrap:not(:last-child) .efin::after{content:"";display:block;height:.5px;background:var(--sep);margin:0 12px}
.lrow.isopen{border-bottom:0}
.efr1{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--sep)}
.ln-i{flex:1;min-width:0;border:0;background:none;outline:none;border-radius:0;padding:8px 0;font-size:13.5px;min-height:34px;-webkit-appearance:none;appearance:none}
.amt2{flex:none;display:flex;align-items:baseline;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.amt2 input{border:0;background:none;outline:none;padding:0;border-radius:0;font-size:15px;font-weight:600;min-width:0;width:1.3ch;font-variant-numeric:tabular-nums;color:var(--ink2)}
.amt2 span{margin-right:1px}
.efgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:6px;align-items:center;margin-top:10px}
#fCats{display:contents}
.crow{display:flex;flex-wrap:wrap;gap:5px;grid-column:1}
.crow:nth-child(1){grid-row:1}
.crow:nth-child(2){grid-row:2}
.dtl{grid-column:2;grid-row:1;position:relative;justify-self:end;padding:3px 10px;border-radius:12px;background:var(--fill);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dtl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;min-height:0;background:none}
.efgrid .btn.del{grid-column:2;grid-row:2;justify-self:end;padding:3px 4px}

/* v8 black-and-white accent, outlined tags */
@media (prefers-color-scheme:dark){:root{--card-lt:#1c1c1e}}
.lines{background:var(--card-lt)}
.lines .efwrap{background:var(--bg)}
.efwrap.solo{background:var(--bg);box-shadow:inset 0 0 0 1px var(--sep)}
.ef .chip{background:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--ink2);font-weight:400}
.ef .chip.on{background:none;box-shadow:inset 0 0 0 1px var(--k,var(--ink));color:var(--ink);font-weight:600}
.dtl{background:none;box-shadow:inset 0 0 0 1px var(--sep)}

/* v9 */
:root{--sep-l:#e9e9ed}
@media (prefers-color-scheme:dark){:root{--sep-l:#2a2a2c}}
.calwrap{background:var(--card-lt);border-radius:8px;margin-top:4px}
.calwrap .cal{padding:10px 18px 6px;margin-top:0}
.ef{--sep:var(--sep-l)}
.dtl{background:var(--fill);box-shadow:none}
.ef .chip.on{background:var(--k,var(--ink));box-shadow:none;color:#1c1c1e;font-weight:600}

/* v10 equal vertical gaps */
.ef,.lines .ef{padding:1px 18px 9.5px}

/* inline edit, popup */
.lrow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.kd.sup::after{content:"";position:absolute;inset:-10px -5px -10px -10px}
.inl{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;outline:none;min-width:2ch;max-width:100%;-webkit-appearance:none;appearance:none;box-shadow:inset 0 -1px 0 var(--mute);-webkit-user-select:text;user-select:text}
.inl-shop{font-family:ui-monospace,SFMono-Regular,Menlo,"Hiragino Sans","PingFang SC",monospace;font-size:11px;margin-left:4px;padding:1px 6px;background:var(--fill);border-radius:5px;box-shadow:none}
.inl-amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.pop{position:fixed;z-index:60;min-width:150px;padding:5px;border-radius:14px;background:var(--glass-w);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 .5px var(--sep);opacity:0;transform:translateY(-4px) scale(.97);transform-origin:top left;transition:opacity .12s ease,transform .12s ease}
.pop.in{opacity:1;transform:none}
.popi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:9px;text-align:left;font-size:15px}
.popi.on{background:var(--fill);font-weight:600}
.popi.danger{color:var(--danger)}
@media (hover:hover){.popi:hover{background:var(--fill)}}
.poph{padding:6px 12px 7px;font-size:12px;color:var(--mute);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.pop{transition:none}}

/* v6: glass popup (same recipe as the 导论 bars), lifted row, no focus ring */
.pop{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(24px) saturate(1.9) brightness(1.1);backdrop-filter:blur(24px) saturate(1.9) brightness(1.1);border:.5px solid rgba(60,60,67,.18);box-shadow:0 10px 30px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.pop{background:rgba(70,70,74,.3);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);border-color:rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.5)}}
.pop{min-width:120px}
.lrow{position:relative;touch-action:pan-y;transition:background-color .15s ease}
.inl:focus,.inl:focus-visible,.lrow:focus,.lrow:focus-visible{outline:none}

/* v7: swipe to delete, chip popup */
.trash{display:none;position:absolute;top:0;bottom:0;width:100px;align-items:center;background:#FF3B30;color:#fff}
.lrow.sw .trash{display:flex}
.trash{left:100%;justify-content:flex-start;padding-left:31px;font-size:15px;font-weight:500}
.pop{padding:8px;border:0;box-shadow:0 8px 26px rgba(0,0,0,.12)}
.pop .crow{display:flex;flex-wrap:nowrap;gap:5px}
.pop .crow+.crow{margin-top:5px}
.pop .chip{padding:3px 10px;font-size:12px;border-radius:12px;background:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--ink2);font-weight:400;white-space:nowrap}
.pop .chip.on{background:var(--k,var(--ink));box-shadow:none;color:#1c1c1e;font-weight:600}
@media (prefers-color-scheme:dark){.pop{border:0;box-shadow:0 8px 26px rgba(0,0,0,.5)}}

/* v11 grouped theme: gray canvas, white groups, blue accent, line icons */
:root{--bg:#f2f2f7;--card:#ffffff;--card-lt:#ffffff;--sep:#c6c6c8;--sep-l:#e5e5ea;--accent:#007AFF;--on-accent:#ffffff;--tint:#e5f0ff;--tint-ink:#007AFF;--bar:#007AFF;--glass:rgba(242,242,247,.8);--glass-w:rgba(255,255,255,.8);--grp:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#000000;--card-lt:#000000;--sep:#38383a;--sep-l:#2c2c2e;--accent:#0A84FF;--on-accent:#ffffff;--tint:#0a2a52;--tint-ink:#0A84FF;--bar:#0A84FF;--glass:rgba(28,28,30,.72);--glass-w:rgba(44,44,46,.8);--grp:#000000}}
.top{background:var(--glass);border-bottom:0}
.top-in{grid-template-columns:1fr auto;height:44px;padding-inline:8px}
.hl,.hb{display:flex;align-items:center}
.hb{justify-self:end}
.ib{color:var(--accent)}
.ttlwrap{max-width:560px;margin-inline:auto;padding:0 12px}
.ttl{margin:2px 0 4px;padding:0 6px;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-align:left;font-variant-numeric:tabular-nums}
main{padding-top:6px}
.lines,.calwrap,.efwrap.solo,.cats2{background:var(--grp);border-radius:10px}
.lines{padding:0 12px}
.calwrap{margin-top:8px}
.efwrap.solo{box-shadow:none;margin-top:8px}
.lines .efwrap{background:var(--grp)}
.cats2{padding:6px 8px;margin:0;column-gap:8px}
.catr{padding:8px 6px;gap:10px}
.catr.sel{box-shadow:inset 0 0 0 1px var(--accent)}
.ci,.ri{display:grid;place-items:center;color:var(--accent);flex:none}
.ci{width:20px;height:20px}
.ci svg{width:19px;height:19px}
.lrow{padding:11px 6px}
.lrow .t{padding-left:32px}
.ri{position:absolute;left:0;top:50%;transform:translateY(-50%);width:22px;height:22px}
.ri::after{content:"";position:absolute;inset:-12px -6px -12px -8px}
.calbar{margin-top:4px}
.calbar button{color:var(--accent)}
.fab{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(0,122,255,.35)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.ef .chip.on,.pop .chip.on{background:var(--accent);box-shadow:none;color:#fff;font-weight:600}
.cal-d.today .n{background:var(--accent);color:#fff}
.cal-d.sel .n{box-shadow:inset 0 0 0 1.5px var(--accent)}
.fbar button{background:var(--grp);color:var(--accent)}
.day{color:var(--mute);margin-top:22px}
.pop .chip{box-shadow:inset 0 0 0 1px var(--sep-l)}
.dtl{background:var(--fill);color:var(--ink2)}
.dot{background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.sheet .fld input{background:var(--bg)}
.inl{box-shadow:inset 0 -1px 0 var(--accent)}

/* v12 */
.trash{color:rgba(255,255,255,var(--p,1));padding-left:16px}
.lrow.sw{will-change:transform}
.ttlwrap{padding-inline:16px}
.ttl{padding:0 2px;font-weight:800;letter-spacing:-.04em}
.ttlrow{display:flex;align-items:center}
.ttlrow .ib{color:var(--ink);width:34px;height:34px;margin-top:4px}
.ttlrow .ib:first-of-type{margin-left:8px}
main{padding-inline:16px}
.lines{padding:0 8px}
.lines .efwrap{margin-inline:-8px}
.ef,.lines .ef{padding-inline:14px}
.cats2{padding-inline:4px}
.cal,.calwrap .cal{padding-inline:14px}
.fbar{margin-inline:0}
.lrow .a,.inl-amt{font-weight:400}
.day{margin:24px 0 8px;padding:0 4px 0 0;font-size:17px;font-weight:700;color:var(--ink);align-items:baseline}
.day b{font-size:15px;font-weight:500;color:var(--mute)}

/* v13 calendar as a full-width white band (Apple Calendar style) */
body{overflow-x:clip}
.calwrap{background:none;border-radius:0;width:100vw;margin:6px 0 0 calc(50% - 50vw)}
.calwrap .cal,.cal{padding:0;margin:0}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 0 6px}
.cal-h span{padding:0;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink)}
.cal-g{background:var(--grp);border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep);padding:0}
.cal-g .cal-d{min-height:46px;padding-top:4px;border-radius:0}
.cal-g .cal-d:nth-child(n+8){background-image:linear-gradient(var(--sep-l),var(--sep-l));background-size:100% .5px;background-repeat:no-repeat}
.cal-d:nth-child(7n+1) .n,.cal-d:nth-child(7n) .n{color:var(--mute)}
.cal-d.today .n{color:#fff}

/* v14 */
.cal-g .cal-d{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;padding:0}
.cal-g .cal-d .v{margin-top:-1px;line-height:1.1}
.cal-g .cal-d.today .v{margin-top:2px}
.day{padding-right:14px}
.day b{font-size:17px;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="hl"></div>
  <div class="hb"><button class="ib" id="syncBtn" aria-label="今すぐ同期"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><i class="dot" id="dot"></i></button><button class="ib" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</div></header>
<div class="ttlwrap"><div class="ttlrow"><h1 class="ttl" id="label"></h1><button class="ib" id="prev" aria-label="前の月"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="ib" id="next" aria-label="次の月"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div></div>

<main id="main"></main>

<button class="fab" id="fab" aria-label="記録を追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="scrim" id="scrim"></div>

<div id="efStore" hidden><div class="ef" id="ef">
  <div class="efr1">
    <input class="ln-i" id="fNote" autocomplete="off" placeholder="内容">
    <label class="amt2"><span>¥</span><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0"></label>
  </div>
  <input class="ln" id="fShop" autocomplete="off" placeholder="場所">
  <div class="efgrid">
    <div id="fCats"></div>
    <label class="dtl"><span id="fDateTxt"></span><input type="date" id="fDate"></label>
    <button class="btn del" id="fDel" type="button" hidden>削除</button>
  </div>
</div></div>

<section class="sheet" id="setSheet" aria-label="設定">
  <div class="sh-h"><h2>GitHub 同期</h2><button class="ib" data-close aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <label class="fld"><span>リポジトリ</span><input id="srepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="owner/repo"></label>
  <label class="fld"><span>トークン</span><input id="stoken" type="password" autocomplete="off" placeholder="fine-grained トークンを貼り付け"></label>
  <div class="acts"><button class="btn pri" id="ssave">保存して同期</button></div>
  <div class="note-s" id="syncNote"></div>
  <p class="hint">記録はまずこの端末に保存され、リポジトリの data.json と同期されます。オンラインに戻ったときにも同期されます。</p>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('lg:' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('lg:' + k, JSON.stringify(v)); }catch(e){} }
};
const CATS = ['Eating', 'Drinking', 'Transport', 'Goods', 'Medical', 'Groceries', 'Other'];
const LABELS = {Eating: '食事', Drinking: '飲み物', Transport: '交通', Goods: 'ショッピング', Medical: '医療', Groceries: '家用', Other: 'その他'};
const IC = {
  Eating: '<path d="M6 3v5a2 2 0 0 0 4 0V3M8 3v7M8 10v11M16 21V3c-2.2 1.6-3.2 4-3.2 7.5H16"/>',
  Drinking: '<path d="M5.5 8h13l-1.2 11.2a1.6 1.6 0 0 1-1.6 1.4H8.3a1.6 1.6 0 0 1-1.6-1.4L5.5 8zM4.5 8h15M13 8l1.4-4.6H17"/>',
  Transport: '<path d="M7 3h10a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2zM5 11h14M8 18l-2 3M16 18l2 3M8.5 14.5h.01M15.5 14.5h.01"/>',
  Goods: '<path d="M5 8h14l-1 12H6L5 8zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
  Medical: '<path d="M4 8h16v11.5H4V8zM9 8V6.2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V8M12 11.2v5.2M9.4 13.8h5.2"/>',
  Groceries: '<path d="M4 11.5L12 4.5l8 7M6 10v10h12V10M10 20v-5h4v5"/>',
  Other: '<circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'
};
const icon = (c, n) => `<svg viewBox="0 0 24 24" width="${n || 20}" height="${n || 20}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${IC[c] || IC.Other}</svg>`;
const kdot = c => `<i class="ci">${icon(c, 19)}</i>`;
const splitNote = n => { const i = n.lastIndexOf(' / '); return i > 0 ? [n.slice(0, i), n.slice(i + 3)] : [n, '']; };
const catLabel = c => LABELS[c] || c;
const GUESS = [
  ['Medical', /pharmacy|drugstore|clinic|hospital|doctor|medicine|dental|dentist|病院|薬局|薬|クリニック|歯科|医院|药|医院|看病|诊所|牙/i],
  ['Drinking', /coffee|cafe|latte|tea|beer|wine|sake|juice|boba|drink|bar\b|コーヒー|カフェ|ビール|お茶|ジュース|飲み|咖啡|奶茶|啤酒|饮料|果汁|喝|yogurt|ヨーグルト|酸奶|milk|soda|cola|water|bottle|smoothie|牛乳|ミルク|ソーダ|コーラ|水|ペットボトル|乳酸菌|牛奶|矿泉水|汽水|可乐/i],
  ['Groceries', /grocer|supermarket|market|fruit|vegetable|meat|fish|egg|\brice\b|seasoning|soy sauce|miso|konbini|convenience|lawson|familymart|family mart|seven|ministop|aeon|detergent|tissue|toilet paper|shampoo|soap|スーパー|コンビニ|ローソン|ファミマ|セブン|ミニストップ|イオン|野菜|果物|肉|魚|卵|米|調味料|醤油|味噌|洗剤|ティッシュ|トイレットペーパー|シャンプー|石鹸|日用|超市|买菜|水果|蔬菜|调料|纸巾|洗发|洗衣/i],
  ['Eating', /lunch|dinner|breakfast|ramen|sushi|restaurant|bento|snack|izakaya|curry|meal|ランチ|ラーメン|寿司|居酒屋|弁当|定食|午饭|晚饭|早饭|外卖|吃|饭|面|餐/i],
  ['Transport', /train|bus|taxi|suica|pasmo|metro|subway|fare|電車|バス|タクシー|交通|地铁|电车|公交|打车/i],
  ['Goods', /clothes|shoes|amazon|uniqlo|book|textbook|stationery|toy|figure|merch|goods|coaster|gift|shopping|グッズ|アクスタ|アクリル|コースター|ガチャ|文具|文房具|おもちゃ|玩具|ぬいぐるみ|フィギュア|書籍|参考書|教科書|マンガ|漫画|服|靴|買い物|周边|谷子|盲盒|扭蛋|衣服|鞋|书/i]
];
const guessCat = t => { for (const [c, re] of GUESS) if (re.test(t)) return c; return ''; };

let entries = LS.get('entries', {});   // {id: {id, a, n, c, d, u}}
let del = LS.get('del', {});           // {id: deleted-at ms}
let ym = LS.get('ym', '') ;
const pad = n => String(n).padStart(2, '0');
const dstr = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const today = () => dstr(new Date());
const isDemo = id => id.startsWith('demo-');
if (!/^\d{4}-\d{2}$/.test(ym)) ym = today().slice(0, 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = n => '¥' + Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
const ymLabel = s => `${s.slice(0, 4)}/${s.slice(5)}`;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dayShort = d => { const [y, m, dd] = d.split('-').map(Number); return `${m}月${dd}日(${WD[new Date(y, m - 1, dd).getDay()]})`; };
function dayLabel(d){
  const [y, m, dd] = d.split('-').map(Number), dt = new Date(y, m - 1, dd);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - dt) / 864e5);
  return diff === 0 ? '今日 · ' + dayShort(d) : dayShort(d);
}
let filterCat = null, filterDay = null;

/* ---------- render ---------- */
let calOpen = LS.get('calOpen', true) !== false;
const amtShort = n => '¥' + (n >= 100000 ? Math.round(n / 1000) + 'k' : n.toLocaleString('en-US', {maximumFractionDigits: 0}));

function calHtml(all){
  const [cy, cm] = ym.split('-').map(Number), lead = new Date(cy, cm - 1, 1).getDay(), dim = new Date(cy, cm, 0).getDate(), tdy = today();
  const dsum = {}; all.forEach(e => { dsum[e.d] = (dsum[e.d] || 0) + e.a; });
  let h = '<div class="cal"><div class="cal-h">' + ['日', '月', '火', '水', '木', '金', '土'].map(x => `<span>${x}</span>`).join('') + '</div><div class="cal-g">';
  for (let i = 0; i < lead; i++) h += '<span class="cal-d blank"></span>';
  for (let dn = 1; dn <= dim; dn++){
    const key = `${ym}-${pad(dn)}`, v = dsum[key];
    h += `<button class="cal-d${v ? ' has' : ''}${key === tdy ? ' today' : ''}${key === filterDay ? ' sel' : ''}" data-day="${key}"><span class="n">${dn}</span>${v ? `<span class="v">${amtShort(v)}</span>` : ''}</button>`;
  }
  return h + '</div></div>';
}
function render(){
  const fa = document.activeElement, fid = fa && fa.closest && fa.closest('#ef') ? fa.id : '', fsel = fid && fa.selectionStart != null ? [fa.selectionStart, fa.selectionEnd] : null;
  $('#efStore').appendChild($('#ef'));
  $('#label').textContent = ymLabel(ym);
  $('#next').disabled = ym >= today().slice(0, 7);
  const all = Object.values(entries).filter(e => e.d.startsWith(ym));
  if (filterDay && !filterDay.startsWith(ym)) filterDay = null;
  const by = {}; all.forEach(e => { by[e.c] = (by[e.c] || 0) + e.a; });
  const catList = Object.keys(by).sort((a, b) => by[b] - by[a]);
  if (filterCat && !by[filterCat]) filterCat = null;
  let h = '';
  if (all.some(e => isDemo(e.id))) h += '<div class="fbar" style="margin-top:0">サンプルデータ<button id="clrdemo">サンプルを消す</button></div>';
  if (catList.length) h += '<div class="cats2">' + catList.map(c =>
    `<button class="catr k-${esc(c)}${filterCat === c ? ' sel' : ''}" data-cat="${esc(c)}">${kdot(c)}<span class="nm">${esc(catLabel(c))}</span><span class="am">${fmt(by[c])}</span></button>`).join('') + '</div>';
  h += `<div class="calbar${calOpen ? ' open' : ''}"><button id="calTgl" aria-label="${calOpen ? 'カレンダーを隠す' : 'カレンダーを表示'}" aria-expanded="${calOpen}"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>`;
  h += `<div class="calwrap${calOpen ? ' open' : ''}" id="calWrap"><div class="calin">${calHtml(all)}</div></div>`;
  const list = all.filter(e => (!filterCat || e.c === filterCat) && (!filterDay || e.d === filterDay)).sort((a, b) => b.d.localeCompare(a.d) || (b.t || b.u || 0) - (a.t || a.u || 0));
  if (filterCat || filterDay) h += `<div class="fbar">表示中：${esc([filterCat ? catLabel(filterCat) : '', filterDay ? dayShort(filterDay) : ''].filter(Boolean).join(' · '))}<button id="clr">すべて表示</button></div>`;
  if (!list.length) h += `<div class="empty">${all.length ? '該当する記録はありません。' : 'この月の記録はありません。<br>＋で追加できます。'}</div>`;
  if (openId && openId !== 'new' && !list.some(x => x.id === openId)){ openId = null; efReady = false; efClosing = false; }
  if (openId === 'new') h += efSlot(true);
  let cur = '', open = false;
  const dayTot = {}; list.forEach(e => { dayTot[e.d] = (dayTot[e.d] || 0) + e.a; });
  list.forEach(e => {
    if (e.d !== cur){
      if (open) h += '</div>';
      cur = e.d; open = true;
      h += `<div class="day"><span>${esc(dayLabel(e.d))}</span><b>${fmt(dayTot[e.d])}</b></div><div class="lines">`;
    }
    h += rowHtml(e) + (openId === e.id ? efSlot(false) : '');
  });
  if (open) h += '</div>';
  $('#main').innerHTML = h;
  const slot = $('#efSlot');
  if (slot){
    slot.firstChild.appendChild($('#ef'));
    if (fid){ const el = $('#' + fid); el.focus({preventScroll: true}); if (fsel) try { el.setSelectionRange(fsel[0], fsel[1]); } catch (_) {} }
    if (!efReady){ efReady = true; requestAnimationFrame(() => requestAnimationFrame(() => { slot.classList.add('open'); if (efFocus){ efFocus = false; $('#fNote').focus({preventScroll: true}); } })); }
  }
}
let openId = null, efReady = false, efFocus = false, efClosing = false;
const efSlot = solo => `<div class="efwrap${solo ? ' solo' : ''}${efReady && !efClosing ? ' open' : ''}" id="efSlot"><div class="efin"></div></div>`;
$('#main').addEventListener('click', e => {
  if (e.target.closest('#clrdemo')){ Object.keys(entries).forEach(id => { if (isDemo(id)) delete entries[id]; }); render(); return; }
  if (e.target.closest('#calTgl')){ calOpen = !calOpen; LS.set('calOpen', calOpen); $('#calWrap').classList.toggle('open', calOpen); $('.calbar').classList.toggle('open', calOpen); const tg = $('#calTgl'); tg.setAttribute('aria-expanded', calOpen); tg.setAttribute('aria-label', calOpen ? 'カレンダーを隠す' : 'カレンダーを表示'); return; }
  const cr = e.target.closest('.catr'); if (cr){ filterCat = filterCat === cr.dataset.cat ? null : cr.dataset.cat; render(); return; }
  if (e.target.closest('#clr')){ filterCat = null; filterDay = null; render(); return; }
  const cd = e.target.closest('.cal-d'); if (cd && cd.dataset.day){ filterDay = filterDay === cd.dataset.day ? null : cd.dataset.day; render(); return; }
  const tr = e.target.closest('[data-trash]');
  if (tr){ const id = tr.closest('.lrow').dataset.id; delete entries[id]; del[id] = Date.now(); persist(); markDirty(); if (openId === id){ openId = null; efReady = false; efClosing = false; } swOpen = null; render(); return; }
  if (Date.now() - swSuppress < 400) return;
  if (e.target.closest('.inl')) return;
  const r = e.target.closest('.lrow'); if (r){
    const act = e.target.closest('[data-act]'), id = r.dataset.id;
    if (act && act.dataset.act === 'cat'){ openCatPop(act, id); return; }
    if (act && openId === id){ const f = {it: '#fNote', shop: '#fShop', amt: '#fAmt'}[act.dataset.act]; f && $(f).focus(); return; }
    if (act){ if (openId){ closeEntry(false); } startInline(id, act.dataset.act); return; }
    if (openId === id){ closeEntry(true); return; }
    if (!r.querySelector('.shop')){ if (openId){ closeEntry(false); } startInline(id, 'shop'); }
  }
});
function shiftMonth(k){
  const [y, m] = ym.split('-').map(Number), dt = new Date(y, m - 1 + k, 1);
  ym = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; LS.set('ym', ym); filterDay = null; render(); scrollTo(0, 0);
}
$('#prev').addEventListener('click', () => shiftMonth(-1));
$('#next').addEventListener('click', () => shiftMonth(1));

/* ---------- sheets ---------- */
let editId = null, pickedCat = '', catTouched = false, delArmed = false;
const scrim = $('#scrim');
function showSheet(el){ scrim.classList.add('on'); el.classList.add('on'); $('#fab').style.opacity = '0'; }
function closeSheets(){ $('#fab').style.opacity = ''; document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on')); scrim.classList.remove('on'); document.activeElement && document.activeElement.blur && document.activeElement.blur(); }
scrim.addEventListener('click', closeSheets);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
addEventListener('keydown', e => { if (e.key === 'Escape'){ closeSheets(); closeEntry(true); } });

function paintCats(){
  const list = pickedCat && !CATS.includes(pickedCat) ? CATS.concat(pickedCat) : CATS;
  const chip = c => `<button type="button" class="chip k-${esc(c)}${pickedCat === c ? ' on' : ''}" data-c="${esc(c)}">${esc(catLabel(c))}</button>`;
  $('#fCats').innerHTML = `<div class="crow">${list.slice(0, 4).map(chip).join('')}</div><div class="crow">${list.slice(4).map(chip).join('')}</div>`;
}
$('#fCats').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  pickedCat = b.dataset.c; catTouched = true; paintCats(); commit();
});
const sizeAmt = () => { const i = $('#fAmt'); i.style.width = (Math.max(1, i.value.length) + .3) + 'ch'; };
$('#fAmt').addEventListener('input', sizeAmt);
function openEntry(id){
  if (efClosing) return;
  editId = id || null; delArmed = false;
  const e = id ? entries[id] : null;
  $('#fAmt').value = e ? String(e.a) : '';
  const [nIt, nSh] = splitNote(e ? e.n : '');
  $('#fNote').value = nIt; $('#fShop').value = nSh;
  $('#fDate').value = e ? e.d : today(); setDateTxt();
  pickedCat = e ? e.c : ''; catTouched = !!e; paintCats(); sizeAmt();
  $('#fDel').hidden = !e; $('#fDel').textContent = '削除';
  openId = id || 'new'; efReady = false; efClosing = false; efFocus = !e;
  render();
  if (!e) setTimeout(() => { const s = $('#efSlot'); s && s.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }, 60);
}
function closeEntry(anim){
  if (!openId || efClosing) return;
  const s = $('#efSlot'), fin = () => { const ce = entries[editId]; if (ce && !ce.d.startsWith(ym)){ ym = ce.d.slice(0, 7); LS.set('ym', ym); } openId = null; efReady = false; efClosing = false; render(); };
  if (anim && s){ efClosing = true; s.classList.remove('open'); document.activeElement && document.activeElement.blur && document.activeElement.blur(); setTimeout(fin, 210); } else fin();
}
$('#fab').addEventListener('click', () => { if (openId === 'new') closeEntry(true); else openEntry(null); });
const noteText = () => [$('#fNote').value.trim(), $('#fShop').value.trim()].filter(Boolean).join(' / ');
const TRASH = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.8 12.2h9.4L17.5 7M10 11v5.5M14 11v5.5"/></svg>';
function rowHtml(e){
  const [it, sh] = splitNote(e.n || catLabel(e.c));
  return `<div class="lrow${openId === e.id ? ' isopen' : ''}" data-id="${esc(e.id)}" role="button" tabindex="0"><button class="trash" data-trash="1" tabindex="-1">削除</button><span class="t"><span class="ri" data-act="cat">${icon(e.c, 20)}</span><span class="it" data-act="it">${esc(it)}</span>${sh ? ` <code class="shop" data-act="shop">${esc(sh)}</code>` : ''}</span><span class="a" data-act="amt">${fmt(e.a)}</span></div>`;
}

/* ---------- Inline edit, category popup, long-press menu ---------- */
let swSuppress = 0, swOpen = null, inlActive = null, staleT = null;
const rowEl = id => document.querySelector(`.lrow[data-id="${id}"]`);
function scheduleRefresh(){ clearTimeout(staleT); staleT = setTimeout(() => { if (!inlActive && !popEl) render(); else scheduleRefresh(); }, 280); }
function startInline(id, kind){
  const row = rowEl(id), e = entries[id]; if (!row || !e) return;
  let span = row.querySelector(`[data-act="${kind}"]`);
  if (!span && kind === 'shop'){ span = document.createElement('code'); span.className = 'shop'; row.querySelector('.t').appendChild(span); }
  if (!span) return;
  const [it, sh] = splitNote(e.n || '');
  const orig = kind === 'it' ? it : kind === 'shop' ? sh : String(e.a);
  const inp = document.createElement('input');
  inp.className = 'inl inl-' + kind; inp.value = orig; inp.autocomplete = 'off';
  if (kind === 'amt') inp.inputMode = 'decimal';
  const size = () => { inp.style.width = (Math.max(2, [...inp.value].reduce((w, c) => w + (c.charCodeAt(0) > 255 ? 2 : 1), 0)) + .6) + 'ch'; };
  size();
  span.replaceWith(inp); inlActive = inp;
  inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (_) {}
  let done = false;
  const save = () => {
    const cur = entries[id]; if (!cur) return;
    const [ci, cs] = splitNote(cur.n || '');
    let n = cur.n, a = cur.a; const v = inp.value.trim();
    if (kind === 'it'){ if (!v) return; n = [v, cs].filter(Boolean).join(' / '); }
    else if (kind === 'shop') n = [ci, v].filter(Boolean).join(' / ');
    else { const x = Number(v.replace(/[,\s¥]/g, '')); if (!isFinite(x) || x <= 0) return; a = Math.round(x * 100) / 100; }
    entries[id] = {...cur, n, a, u: Date.now(), t: cur.t || cur.u || Date.now()};
    persist(); markDirty();
  };
  inp.addEventListener('input', () => { size(); save(); });
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') inp.blur(); else if (ev.key === 'Escape'){ inp.value = orig; save(); inp.blur(); } });
  inp.addEventListener('blur', () => {
    if (done) return; done = true; inlActive = null;
    const r = rowEl(id); if (r && entries[id]) r.outerHTML = rowHtml(entries[id]);
    scheduleRefresh();
  });
}
let popEl = null;
function closePop(){ if (popEl){ popEl.remove(); popEl = null; } }
function placePop(x, y, anchorH){
  const w = popEl.offsetWidth, h = popEl.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = Math.min(Math.max(8, x), vw - w - 8), top = y + anchorH + 6;
  if (top + h > vh - 8) top = Math.max(8, y - h - 6);
  popEl.style.left = left + 'px'; popEl.style.top = top + 'px';
}
function showPop(html, x, y, anchorH){
  closePop();
  popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = html;
  document.body.appendChild(popEl); placePop(x, y, anchorH);
  requestAnimationFrame(() => popEl && popEl.classList.add('in'));
}
function openCatPop(dot, id){
  const e = entries[id]; if (!e) return;
  const r = dot.getBoundingClientRect();
  const list = CATS.includes(e.c) ? CATS : CATS.concat(e.c);
  const chip = c => `<button type="button" class="chip k-${esc(c)}${c === e.c ? ' on' : ''}" data-pc="${esc(c)}">${esc(catLabel(c))}</button>`;
  showPop(`<div class="crow">${list.slice(0, 4).map(chip).join('')}</div><div class="crow">${list.slice(4).map(chip).join('')}</div>`, r.left - 6, r.top, r.height);
  popEl.dataset.id = id; popEl.dataset.kind = 'cat';
}
document.addEventListener('pointerdown', ev => { if (popEl && !popEl.contains(ev.target)) closePop(); }, true);
addEventListener('scroll', closePop, {passive: true});
addEventListener('resize', closePop);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closePop(); });
document.addEventListener('click', ev => {
  if (!popEl || !popEl.contains(ev.target)) return;
  const id = popEl.dataset.id, kind = popEl.dataset.kind;
  const b = ev.target.closest('button'); if (!b) return;
  if (kind === 'cat' && b.dataset.pc){
    const c = b.dataset.pc, cur = entries[id];
    if (cur && cur.c !== c){
      entries[id] = {...cur, c, u: Date.now(), t: cur.t || cur.u || Date.now()}; persist(); markDirty();
      if (openId === id){ pickedCat = c; catTouched = true; paintCats(); }
      const r = rowEl(id); if (r) r.outerHTML = rowHtml(entries[id]);
      scheduleRefresh();
    }
    closePop();
  }
});
const SW_OPEN = 53;
function swSet(r, x, anim){ r.style.transition = anim ? 'transform .36s cubic-bezier(.22,1,.36,1)' : 'none'; r.style.transform = x ? `translateX(${x}px)` : ''; r.dataset.sx = x; r.style.setProperty('--p', Math.min(1, Math.abs(x) / SW_OPEN).toFixed(2)); }
function swDone(r){ setTimeout(() => { if (r.dataset.sx === '0'){ r.classList.remove('sw'); r.style.transition = ''; } }, 400); }
function swClose(){ const r = swOpen; if (!r) return; swOpen = null; swSet(r, 0, true); swDone(r); }
addEventListener('scroll', swClose, {passive: true});
(function(){
  const main = $('#main');
  let r = null, sx = 0, sy = 0, base = 0, mode = null, cur = 0, smp = [];
  main.addEventListener('pointerdown', ev => {
    if (swOpen && !(swOpen.contains(ev.target) && ev.target.closest('.trash'))){ if (swOpen.contains(ev.target)) swSuppress = Date.now(); swClose(); }
    r = ev.target.closest('.lrow');
    if (!r || ev.target.closest('.inl') || ev.target.closest('.trash') || (ev.pointerType === 'mouse' && ev.button !== 0)){ r = null; return; }
    sx = ev.clientX; sy = ev.clientY; mode = null; base = Number(r.dataset.sx || 0); cur = base; smp = [];
  });
  main.addEventListener('pointermove', ev => {
    if (!r) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!mode){
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ mode = 'h'; sx = ev.clientX; r.classList.add('sw'); try { r.setPointerCapture(ev.pointerId); } catch (_) {} }
      else if (Math.abs(dy) > 8){ mode = 'v'; }
      return;
    }
    if (mode === 'h'){
      let x = Math.min(0, base + (ev.clientX - sx));
      const over = -x - SW_OPEN;
      if (over > 0) x = -(SW_OPEN + 56 * (1 - Math.exp(-over / 80)));
      cur = x; swSet(r, x, false);
      smp.push({t: performance.now(), x: ev.clientX}); if (smp.length > 6) smp.shift();
    }
  });
  const end = () => {
    if (r && mode === 'h'){
      swSuppress = Date.now();
      let v = 0; if (smp.length > 1){ const a = smp[0], b = smp[smp.length - 1]; if (b.t - a.t > 0 && performance.now() - b.t < 120) v = (b.x - a.x) / (b.t - a.t); }
      const open = Math.abs(v) > .3 ? v < 0 : -cur > SW_OPEN / 2;
      if (open){ swOpen = r; swSet(r, -SW_OPEN, true); }
      else { if (swOpen === r) swOpen = null; swSet(r, 0, true); swDone(r); }
    }
    r = null; mode = null;
  };
  ['pointerup', 'pointercancel'].forEach(t => main.addEventListener(t, end));
})();
function commit(){
  const a = Number(String($('#fAmt').value).replace(/[,\s¥]/g, ''));
  if (!isFinite(a) || a <= 0) return;
  const d = /^\d{4}-\d{2}-\d{2}$/.test($('#fDate').value) ? $('#fDate').value : today();
  const created = !editId, id = editId || uid();
  const prev = entries[id];
  entries[id] = {id, a: Math.round(a * 100) / 100, n: noteText(), c: pickedCat || 'Other', d, u: Date.now(), t: (prev && (prev.t || prev.u)) || Date.now()};
  delete del[id];
  persist(); markDirty();
  if (created){ editId = id; openId = id; $('#fDel').hidden = false; render(); return; }
  const r = document.querySelector(`.lrow[data-id="${id}"]`);
  if (r) r.outerHTML = rowHtml(entries[id]);
}
function onEdit(){
  if (!catTouched){ const g = guessCat(noteText()); if (g !== pickedCat){ pickedCat = g; paintCats(); } }
  commit();
}
['fAmt', 'fNote', 'fShop'].forEach(i => $('#' + i).addEventListener('input', onEdit));
const setDateTxt = () => { const v = $('#fDate').value; $('#fDateTxt').textContent = v ? `${v.slice(2, 4)}/${+v.slice(5, 7)}/${+v.slice(8, 10)}` : ''; };
$('#fDate').addEventListener('change', () => { setDateTxt(); onEdit(); });
$('#fDate').addEventListener('click', e => { try { e.target.showPicker(); } catch (_) {} });
$('#fNote').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fAmt').focus(); });
$('#fAmt').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fShop').focus(); });
$('#fShop').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
let delT = null;
$('#fDel').addEventListener('click', () => {
  if (!editId) return;
  if (!delArmed){ delArmed = true; $('#fDel').textContent = '本当に？'; clearTimeout(delT); delT = setTimeout(() => { delArmed = false; $('#fDel').textContent = '削除'; }, 3000); return; }
  delete entries[editId]; del[editId] = Date.now();
  persist(); openId = null; efReady = false; efClosing = false; render(); markDirty();
});
function persist(){ LS.set('entries', entries); LS.set('del', del); }

/* ---------- GitHub Sync ----------
   Same model as the other pages: data lives on this device first; a sync pulls data.json from the data
   repository, merges it entry by entry (newest change wins, deletions kept as dated tombstones) and pushes
   the merged result back. Entries added to data.json from elsewhere (for example by Claude in chat) show up
   on the next sync. */
const GH_FILE = 'data.json', DEFAULT_REPO = 'bambusaceae/ledger-data';
const ghTok = () => LS.get('token', '');
const ghRepo = () => LS.get('repo', '');
const sOn = () => !!(ghTok() && ghRepo());
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => { const bin = atob(s.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
const setSync = msg => { const n = $('#syncNote'); if (n) n.textContent = msg; };
const sortObj = o => Object.fromEntries(Object.keys(o).sort().map(k => [k, o[k]]));
const cleanEntry = (id, r) => {
  if (!r || typeof r !== 'object') return null;
  const a = Number(r.a), d = String(r.d || '');
  if (!isFinite(a) || a <= 0 || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  return {id, a, n: String(r.n || ''), c: String(r.c || 'Other'), d, u: Number(r.u) || 0, t: Number(r.t) || Number(r.u) || 0};
};
const normDoc = (E, D) => {
  const es = {}; Object.keys(E).forEach(id => { const c = cleanEntry(id, E[id]); if (c) es[id] = c; });
  return {version: 1, entries: sortObj(es), del: sortObj(D)};
};
const syncSt = {busy: false, error: ''};
let syncT = null;
const isDirty = () => +LS.get('dirty', 0) > 0;
function paintDot(){ $('#dot').classList.toggle('on', !sOn() || isDirty()); }
function markDirty(){ LS.set('dirty', Date.now()); paintDot(); clearTimeout(syncT); syncT = setTimeout(sync, 1200); }

function mergeRemote(R){
  const re = {}; Object.keys(R.entries || {}).forEach(id => { const c = cleanEntry(id, R.entries[id]); if (c) re[id] = c; });
  const rd = R.del || {};
  new Set([...Object.keys(entries), ...Object.keys(del), ...Object.keys(re), ...Object.keys(rd)]).forEach(id => {
    const le = entries[id], lt = le ? (le.u || 0) : -1, ldt = del[id] != null ? del[id] : -1;
    const r = re[id], rt = r ? (r.u || 0) : -1, rdt = rd[id] != null ? rd[id] : -1;
    const best = Math.max(lt, ldt, rt, rdt);
    if (best === lt && le){ delete del[id]; return; }                      // local entry is newest (ties keep the entry)
    if (best === rt && r){ entries[id] = Object.assign({}, r); delete del[id]; return; }
    delete entries[id]; del[id] = best;                                       // a deletion is newest
  });
  persist(); render();
}
function ghFetch(path, opts = {}){
  return fetch(`https://api.github.com/repos/${ghRepo()}/contents/${path}`, Object.assign({}, opts, {cache: 'no-store',
    headers: Object.assign({Authorization: 'Bearer ' + ghTok(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, opts.body ? {'Content-Type': 'application/json'} : {}, opts.headers || {})}));
}
async function sync(){
  if (!sOn()){ setSync('GitHub 同期はオフです'); paintDot(); return; }
  if (!navigator.onLine){ setSync('オフラインです。変更は端末に保存され、オンラインに戻ると同期されます'); return; }
  if (syncSt.busy) return;
  syncSt.busy = true; clearTimeout(syncT);
  const started = Date.now();
  try{
    for (let attempt = 0; attempt < 3; attempt++){
      let sha = null, remoteStr = null;
      const get = await ghFetch(GH_FILE);
      if (get.status === 200){
        const j = await get.json(); sha = j.sha;
        const R = JSON.parse(b64dec(j.content) || '{}');
        remoteStr = JSON.stringify(normDoc(R.entries || {}, R.del || {}));
        mergeRemote(R);
      } else if (get.status === 404){ /* first push creates the file */ }
      else if (get.status === 401 || get.status === 403){ const e = new Error('auth'); e.auth = true; throw e; }
      else throw new Error('GitHub error ' + get.status);
      const body = normDoc(entries, del), bodyStr = JSON.stringify(body);
      if (bodyStr === remoteStr){ if (+LS.get('dirty', 0) <= started) LS.set('dirty', 0); break; }
      const payload = {message: 'Update ' + new Date().toISOString(), content: b64enc(JSON.stringify(body, null, 1) + '\n')};
      if (sha) payload.sha = sha;
      const put = await ghFetch(GH_FILE, {method: 'PUT', body: JSON.stringify(payload)});
      if (put.ok){ if (+LS.get('dirty', 0) <= started) LS.set('dirty', 0); break; }
      if (put.status === 409 || put.status === 422) continue;                // changed elsewhere meanwhile: pull and merge again
      if (put.status === 401 || put.status === 403 || put.status === 404){ const e = new Error('auth'); e.auth = true; throw e; }
      throw new Error('GitHub error ' + put.status);
    }
    syncSt.error = '';
    setSync(isDirty() ? '同期待ちの変更があります' : '同期済み');
  }catch(e){
    syncSt.error = (e && e.message) || 'network error';
    setSync(e && e.auth ? 'GitHub 同期の設定でリポジトリとトークンを確認してください' : (navigator.onLine ? '同期に失敗しました。変更は端末に保存されています' : 'オフラインです。変更は端末に保存され、オンラインに戻ると同期されます'));
  }
  syncSt.busy = false; paintDot();
  if (!syncSt.error && +LS.get('dirty', 0) > started) sync();
}
function setupSyncForm(){
  $('#srepo').value = ghRepo() || DEFAULT_REPO;
  $('#stoken').value = ''; $('#stoken').placeholder = ghTok() ? '保存済み · 貼り付けで置き換え' : 'fine-grained トークンを貼り付け';
}
$('#setBtn').addEventListener('click', () => { setupSyncForm(); showSheet($('#setSheet')); });
$('#ssave').addEventListener('click', () => {
  const t = $('#stoken').value.trim();
  if (t) LS.set('token', t);
  LS.set('repo', $('#srepo').value.trim());
  setupSyncForm(); LS.set('dirty', Date.now()); paintDot(); sync();
});
$('#syncBtn').addEventListener('click', () => { if (!sOn()){ setupSyncForm(); showSheet($('#setSheet')); } else sync(); });
addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); else if (isDirty()) sync(); });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 45000);

/* no pinch zoom */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});

/* ---------- boot ---------- */
render(); paintDot();
if (!sOn()) setSync('GitHub 同期はオフです');
else { setSync(isDirty() ? '同期待ちの変更があります' : '同期中…'); sync(); }
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
